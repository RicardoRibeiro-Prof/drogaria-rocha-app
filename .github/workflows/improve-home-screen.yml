name: Melhorar tela inicial do app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-home-screen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar melhorias na tela inicial
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ClientApp.tsx')
          s = path.read_text(encoding='utf-8')

          old_home = '''function Home({products,loading,add,openProduct,catalog}:any){
  const featured=useMemo(()=>{
    const marked=products.filter((p:AppProduct)=>Boolean(p.badge));
    const newest=[...products].reverse();
    const ids=new Set(marked.map((p:AppProduct)=>p.id));
    return [...marked,...newest.filter((p:AppProduct)=>!ids.has(p.id))].slice(0,8);
  },[products]);

  const sections=[
    ['Infantil','Infantil'],
    ['Dermocosméticos','Dermocosméticos'],
    ['Protetores Solares','Protetores Solares'],
    ['Hidratantes','Hidratantes'],
    ['Sabonetes e Limpeza','Sabonetes e Limpeza'],
    ['Cuidados com os Cabelos','Cabelos'],
    ['Perfumaria','Perfumaria'],
  ];

  return <ScrollView contentContainerStyle={s.page} showsVerticalScrollIndicator={false}>
    <HomeBannerCarousel catalog={catalog}/>
    <Text style={s.section}>Acesso rápido</Text><View style={s.quick}><Quick icon="happy-outline" text="Infantil" onPress={()=>catalog('Infantil')}/><Quick icon="sparkles-outline" text="Dermocosméticos" onPress={()=>catalog('Dermocosméticos')}/><Quick icon="sunny-outline" text="Protetores" onPress={()=>catalog('Protetores Solares')}/><Quick icon="water-outline" text="Hidratantes" onPress={()=>catalog('Hidratantes')}/></View>
    {loading?<ActivityIndicator style={{marginTop:26}} color={C.orange}/>:<>
      <HomeSection title="Destaques" products={featured} onMore={()=>catalog('Todos')} add={add} openProduct={openProduct}/>
      {sections.map(([title,cat])=>{
        const list=products.filter((p:AppProduct)=>p.category===cat).slice(0,8);
        return <HomeSection key={cat} title={title} products={list} onMore={()=>catalog(cat)} add={add} openProduct={openProduct}/>;
      })}
    </>}
  </ScrollView>;
}'''

          new_home = '''function Home({products,loading,add,openProduct,catalog}:any){
  const[homeSearch,setHomeSearch]=useState('');
  const featured=useMemo(()=>{
    const marked=products.filter((p:AppProduct)=>Boolean(p.badge)||hasActiveOffer(p));
    const newest=[...products].reverse();
    const ids=new Set(marked.map((p:AppProduct)=>p.id));
    return [...marked,...newest.filter((p:AppProduct)=>!ids.has(p.id))].slice(0,8);
  },[products]);

  const sections=[
    ['Infantil','Infantil'],
    ['Dermocosméticos','Dermocosméticos'],
    ['Protetores Solares','Protetores Solares'],
    ['Hidratantes','Hidratantes'],
    ['Sabonetes e Limpeza','Sabonetes e Limpeza'],
    ['Cuidados com os Cabelos','Cabelos'],
    ['Perfumaria','Perfumaria'],
  ];

  const submitHomeSearch=()=>catalog('Todos',homeSearch.trim());

  return <ScrollView contentContainerStyle={s.page} showsVerticalScrollIndicator={false} keyboardShouldPersistTaps="handled">
    <HomeBannerCarousel catalog={catalog}/>

    <View style={s.homeSearch}>
      <Ionicons name="search-outline" size={21} color={C.muted}/>
      <TextInput
        value={homeSearch}
        onChangeText={setHomeSearch}
        onSubmitEditing={submitHomeSearch}
        returnKeyType="search"
        placeholder="O que você está procurando?"
        placeholderTextColor="#8A8A8A"
        style={s.homeSearchInput}
      />
      <Pressable style={s.homeSearchButton} onPress={submitHomeSearch}>
        <Ionicons name="arrow-forward" size={19} color={C.white}/>
      </Pressable>
    </View>

    <View style={s.deliveryCard}>
      <View style={s.deliveryIcon}>
        <Ionicons name="bicycle-outline" size={28} color={C.orange}/>
      </View>
      <View style={s.deliveryContent}>
        <Text style={s.deliveryEyebrow}>ENTREGA LOCAL</Text>
        <Text style={s.deliveryTitle}>Entrega em todo o setor urbano</Text>
        <View style={s.deliveryLocationRow}>
          <Ionicons name="location-outline" size={15} color={C.orangeDark}/>
          <Text style={s.deliveryLocation}>São Raimundo Nonato - PI</Text>
        </View>
        <Text style={s.deliveryText}>Escolha seus produtos no app e conclua o atendimento com a Drogaria Rocha.</Text>
      </View>
    </View>

    <View style={s.quickHeader}>
      <View>
        <Text style={s.section}>Acesso rápido</Text>
        <Text style={s.quickSubtitle}>Encontre as principais categorias</Text>
      </View>
    </View>
    <View style={s.quick}>
      <Quick icon="medkit-outline" text="Medicamentos" onPress={()=>catalog('Medicamentos')}/>
      <Quick icon="happy-outline" text="Infantil" onPress={()=>catalog('Infantil')}/>
      <Quick icon="body-outline" text="Higiene" onPress={()=>catalog('Higiene Pessoal')}/>
      <Quick icon="sparkles-outline" text="Dermocosméticos" onPress={()=>catalog('Dermocosméticos')}/>
      <Quick icon="sunny-outline" text="Protetores" onPress={()=>catalog('Protetores Solares')}/>
      <Quick icon="cut-outline" text="Cabelos" onPress={()=>catalog('Cabelos')}/>
    </View>

    {loading?<ActivityIndicator style={{marginTop:26}} color={C.orange}/>:<>
      <HomeSection title="Destaques" products={featured} onMore={()=>catalog('Todos')} add={add} openProduct={openProduct}/>
      {sections.map(([title,cat])=>{
        const list=products.filter((p:AppProduct)=>p.category===cat).slice(0,8);
        return <HomeSection key={cat} title={title} products={list} onMore={()=>catalog(cat)} add={add} openProduct={openProduct}/>;
      })}
    </>}
  </ScrollView>;
}'''

          if old_home not in s:
              raise SystemExit('Trecho Home não encontrado')
          s = s.replace(old_home, new_home, 1)

          old_quick = '''function Quick({icon,text,onPress}:any){return <Pressable style={s.quickItem} onPress={onPress}><View style={s.quickIcon}><Ionicons name={icon} size={25} color={C.orange}/></View><Text style={s.quickText}>{text}</Text></Pressable>}'''
          new_quick = '''function Quick({icon,text,onPress}:any){return <Pressable style={s.quickItem} onPress={onPress}><View style={s.quickIcon}><Ionicons name={icon} size={24} color={C.orange}/></View><Text style={s.quickText} numberOfLines={2}>{text}</Text></Pressable>}'''
          if old_quick not in s:
              raise SystemExit('Trecho Quick não encontrado')
          s = s.replace(old_quick, new_quick, 1)

          old_styles = '''  section:{fontSize:19,fontWeight:'900',marginTop:22,marginBottom:11,color:C.black},quick:{flexDirection:'row',flexWrap:'wrap',gap:9},quickItem:{width:'48%',backgroundColor:C.white,borderRadius:16,borderWidth:1,borderColor:C.border,padding:13,flexDirection:'row',alignItems:'center',gap:8},quickIcon:{width:40,height:40,borderRadius:12,backgroundColor:C.orangeSoft,alignItems:'center',justifyContent:'center'},quickText:{fontWeight:'800',fontSize:12,flex:1},'''
          new_styles = '''  homeSearch:{height:54,marginTop:14,borderRadius:17,backgroundColor:C.white,borderWidth:1,borderColor:C.border,paddingLeft:14,paddingRight:7,flexDirection:'row',alignItems:'center',gap:9},homeSearchInput:{flex:1,color:C.black,fontSize:13,fontWeight:'700'},homeSearchButton:{width:40,height:40,borderRadius:13,backgroundColor:C.orange,alignItems:'center',justifyContent:'center'},
  deliveryCard:{marginTop:14,backgroundColor:C.black,borderRadius:20,padding:16,flexDirection:'row',alignItems:'flex-start',gap:12},deliveryIcon:{width:50,height:50,borderRadius:15,backgroundColor:C.white,alignItems:'center',justifyContent:'center'},deliveryContent:{flex:1},deliveryEyebrow:{fontSize:9,fontWeight:'900',letterSpacing:.8,color:C.orange},deliveryTitle:{fontSize:17,lineHeight:21,fontWeight:'900',color:C.white,marginTop:3},deliveryLocationRow:{flexDirection:'row',alignItems:'center',gap:4,marginTop:6},deliveryLocation:{fontSize:11,fontWeight:'900',color:'#FFD7BA'},deliveryText:{fontSize:10,lineHeight:15,color:'#CFCFCF',marginTop:7},
  quickHeader:{marginTop:22},section:{fontSize:19,fontWeight:'900',marginBottom:2,color:C.black},quickSubtitle:{fontSize:11,color:C.muted,fontWeight:'700'},quick:{flexDirection:'row',flexWrap:'wrap',gap:8,marginTop:11},quickItem:{width:'31.5%',minHeight:96,backgroundColor:C.white,borderRadius:17,borderWidth:1,borderColor:C.border,paddingHorizontal:8,paddingVertical:12,alignItems:'center',justifyContent:'center'},quickIcon:{width:42,height:42,borderRadius:13,backgroundColor:C.orangeSoft,alignItems:'center',justifyContent:'center',marginBottom:7},quickText:{fontWeight:'900',fontSize:10.5,lineHeight:13,textAlign:'center',color:C.black},'''
          if old_styles not in s:
              raise SystemExit('Trecho de estilos rápidos não encontrado')
          s = s.replace(old_styles, new_styles, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Validar TypeScript
        run: |
          npm install
          npx tsc --noEmit
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ClientApp.tsx
          git commit -m "feat: organizar busca, acesso rápido e entrega na home"
          git push
