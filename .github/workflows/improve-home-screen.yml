name: Melhorar tela inicial do app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-home-screen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar melhorias
        run: python .github/scripts/improve_home.py
      - name: Validar TypeScript
        run: |
          npm install
          npx tsc --noEmit
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ClientApp.tsx
          git commit -m "feat: organizar busca, acesso rápido e entrega na home"
          git push
