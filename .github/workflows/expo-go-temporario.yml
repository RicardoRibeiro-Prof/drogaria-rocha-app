name: Expo Go temporario

on:
  pull_request:
    branches: [main]

jobs:
  expo-go:
    if: startsWith(github.head_ref, 'expo-go-session')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Preparar Expo Go
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='app.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          delete j.expo.icon;
          if(j.expo.android){
            delete j.expo.android.icon;
            delete j.expo.android.adaptiveIcon;
          }
          fs.writeFileSync(p,JSON.stringify(j,null,2));
          NODE
          npm install --no-save @expo/ngrok
      - name: Iniciar tunnel e validar acesso publico
        env:
          CI: '1'
        run: |
          nohup npx expo start --tunnel --go > expo.log 2>&1 &
          echo $! > expo.pid
          for i in {1..36}; do
            sleep 5
            grep -q 'Tunnel ready' expo.log && break
          done
          cat expo.log
          grep -q 'Tunnel ready' expo.log

          curl -sS -D expo-link-headers.txt -o expo-link-body.txt 'http://127.0.0.1:8081/_expo/link' || true
          LINK=$(tr -d '\r' < expo-link-headers.txt | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^location:[[:space:]]*/,""); print; exit}')

          if [ -z "$LINK" ]; then
            curl -fsS 'http://127.0.0.1:4040/api/tunnels' -o ngrok-tunnels.json
            LINK=$(node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('ngrok-tunnels.json','utf8'));
          const urls=(data.tunnels||[]).map(t=>t.public_url).filter(Boolean);
          let u=urls.find(x=>x.includes('exp.direct')) || urls.find(x=>x.startsWith('https://')) || urls[0];
          if(!u) process.exit(1);
          const parsed=new URL(u);
          process.stdout.write(`exp://${parsed.hostname}:80`);
          NODE
          )
          fi

          echo "$LINK" > expo-go-link.txt
          HOST=$(echo "$LINK" | sed -E 's#^exp://##; s#:80/?$##')
          echo "Testando host publico: $HOST"

          OK=0
          for i in {1..12}; do
            if curl -fsS --max-time 10 \
              -H 'expo-platform: android' \
              -H 'accept: application/expo+json,application/json,text/plain,*/*' \
              "http://$HOST" -o expo-public-response.txt; then
              OK=1
              break
            fi
            sleep 3
          done
          echo "EXPO_GO_LINK=$LINK"
          head -c 1000 expo-public-response.txt || true
          test "$OK" = "1"
          grep -q '^exp://' expo-go-link.txt
      - name: Publicar link
        uses: actions/upload-artifact@v4
        with:
          name: expo-go-link
          path: |
            expo-go-link.txt
            expo-public-response.txt
          retention-days: 1
      - name: Manter tunnel ativo
        run: sleep 1500
