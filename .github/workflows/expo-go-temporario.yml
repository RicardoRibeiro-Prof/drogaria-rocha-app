name: Expo Go temporario

on:
  pull_request:
    branches: [main]

jobs:
  expo-go:
    if: github.head_ref == 'expo-go-session'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Preparar Expo Go
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='app.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          delete j.expo.icon;
          if(j.expo.android){
            delete j.expo.android.icon;
            delete j.expo.android.adaptiveIcon;
          }
          fs.writeFileSync(p,JSON.stringify(j,null,2));
          NODE
          npm install --no-save @expo/ngrok
      - name: Iniciar tunnel e obter link Expo Go
        env:
          CI: '1'
        run: |
          nohup npx expo start --tunnel --go > expo.log 2>&1 &
          echo $! > expo.pid
          for i in {1..36}; do
            sleep 5
            if grep -q 'Tunnel ready' expo.log; then
              break
            fi
          done
          cat expo.log
          grep -q 'Tunnel ready' expo.log
          for i in {1..12}; do
            curl -fsS 'http://127.0.0.1:8081/_expo/open?platform=android&runtime=expo' -o expo-open.json && break || true
            sleep 3
          done
          cat expo-open.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('expo-open.json','utf8');
          const data=JSON.parse(raw);
          const find=(v)=>{
            if(typeof v==='string' && v.startsWith('exp://')) return v;
            if(Array.isArray(v)) for(const x of v){const r=find(x);if(r)return r;}
            if(v&&typeof v==='object') for(const x of Object.values(v)){const r=find(x);if(r)return r;}
            return null;
          };
          const link=find(data);
          if(!link) throw new Error('Link exp:// não encontrado');
          fs.writeFileSync('expo-go-link.txt',link+'\n');
          console.log(link);
          NODE
      - name: Publicar link
        uses: actions/upload-artifact@v4
        with:
          name: expo-go-link
          path: expo-go-link.txt
          retention-days: 1
      - name: Manter tunnel ativo
        run: sleep 1500
