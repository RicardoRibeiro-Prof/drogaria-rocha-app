name: Validar app mobile Expo

on:
  push:
    branches: [expo-native-rebuild]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - name: Instalar dependências
        run: npm install
      - name: Validar TypeScript
        run: npx tsc --noEmit
      - name: Validar Expo
        run: npx expo-doctor
