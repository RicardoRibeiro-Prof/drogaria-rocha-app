name: Validar e gerar APK Android

on:
  push:
    branches: [main, identidade-admin-v1]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Validar TypeScript
        run: npx tsc --noEmit
      - name: Validar Expo
        run: npx expo-doctor

  build-debug-apk:
    if: github.event_name == 'pull_request' && github.head_ref == 'build-apk-debug'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependências
        run: npm install
      - name: Preparar configuração temporária da build
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='app.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          delete j.expo.icon;
          if(j.expo.android){
            delete j.expo.android.icon;
            delete j.expo.android.adaptiveIcon;
            j.expo.android.package='com.ativadigitalon.drogariarocha.preview';
          }
          fs.writeFileSync(p,JSON.stringify(j,null,2));
          NODE
      - name: Gerar projeto Android
        env:
          CI: '1'
        run: npx expo prebuild --platform android
      - name: Gerar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: drogaria-rocha-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
